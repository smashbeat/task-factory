[project]
name = "taskfactory"
version = "0.1.0"
description = "A generator and a gated pipeline for agent benchmark tasks: documents in, rules decide, every failure attributed"
requires-python = ">=3.13"
dependencies = [
  "pymupdf>=1.26",
  "pillow>=11",
  "numpy>=2",
  "openpyxl>=3.1",
  "pytesseract>=0.3",
]

[project.scripts]
taskfactory = "taskfactory.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskfactory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
