[project]
name = "taskfactory"
version = "0.1.0"
description = "Gates for agent benchmark tasks: quality, difficulty and fairness, checked on evidence"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
taskfactory = "taskfactory.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskfactory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
